<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content, maximum-scale=1.0, user-scalable=no" />
    <title>Neural-Lite</title>
    <link rel="icon" type="image/png" href="/alien-monster_1f47e.png" />
    <link rel="preload" href="/assets/fonts/LucidaGrande.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/LucidaGrande-Bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preconnect" href="https://fonts.loli.net">
    <link rel="preconnect" href="https://gstatic.loli.net" crossorigin>
    <link href="https://fonts.loli.net/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+TC:wght@400;700&display=block" rel="stylesheet">
    <style>
      body {
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.2s ease-out;
      }
      body.fonts-loaded {
        opacity: 1;
        visibility: visible;
      }
    </style>
    <script>
      document.fonts.ready.then(() => {
        document.body.classList.add('fonts-loaded');
      });
      // Fallback
      setTimeout(() => {
        document.body.classList.add('fonts-loaded');
      }, 1500);
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
